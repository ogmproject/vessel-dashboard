name: Update vessel data

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this slightly under load —
    # that's normal for free-tier scheduled Actions.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write
  issues: write   # needed so the workflow can open an alert Issue on repeated failures

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: run_scraper
        run: python scraper.py
        continue-on-error: true   # let later steps (health check, commit) still run even if this fails

      - name: Track scraper health
        id: health
        run: python check_health.py "${{ steps.run_scraper.outcome }}"

      - name: Alert after 3 consecutive failures
        if: steps.health.outputs.consecutive_failures == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo ${{ github.repository }} --state open \
            --search "Vessel scraper has failed in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "⚠️ Vessel scraper has failed 3 times in a row" \
              --body "The scheduled scraper (.github/workflows/update-data.yml) has failed 3 runs in a row as of $(date -u +'%Y-%m-%d %H:%M UTC'). Check the Actions tab for error logs — the dashboard may be showing stale data until this is fixed. Close this issue once it's resolved; a new one will be opened automatically if it happens again."
          fi

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "vessel-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vessel_data.json data/mmsi_cache.json data/health_status.json
          git diff --quiet --cached || git commit -m "Auto-update vessel data [skip ci]"
          git push

      - name: Fail the job if the scraper failed
        if: steps.run_scraper.outcome == 'failure'
        run: exit 1
